<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 5:</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1 style="color:red; background-color:black">Nguyễn Công Đạo</h1>
    <h2>Nguyễn Công Đạo</h2>
    <style>
    h2{
        color:black;
        background-color:red;
    }
    </style>
    <h3>Nguyễn Công Đạo</h3>
    <!-- nếu là id sử dụng dấu # + tên id-->
    <h3 id="tieude-1">WEB-1</h3>
    <!--nếu là class sử dụng dấu . + tên class -->
    <h3 class="tieude-2">WEB-2</h3>
    <!-- element.class -->
    <div>WEB-3</div>
    <div class="web4">WEB-3</div>
    <!-- margin: tạo khoảng cách xung quanh.
     (giá trị 1:trên, dưới
     giá trị 2:trái, phải
     có 4 giá trị thì theo thứ tự : trên, phải, dưới, trái)
     (width:chiều rộng, height:chiều cao.)
     padding: tạo khoảng trống bên trong, căn chỉnh vị trí
     (giá trị 1:trên, dưới
     giá trị 2:trái, phải
     có 4 giá trị thì theo thứ tự : trên, phải, dưới, trái)
     display: xác định cách hiển thị phần tử
     #pond{
     display: flex;

     1> justify-content(ngang): 
     flex-end(di chuyển sang bên phải)
     flex-start(di chuyển sang bên trái)
     center(di chuyển ra giữa)
     space-between(giãn cách đều)
     space-around(giãn cách đều nhưng có khoảng cách 2 bên)
     2> align-items(dọc):
        flex-end(di chuyển xuống dưới)
        flex-start(di chuyển lên trên)
        center(di chuyển ra giữa)
    3> flex-direction: xác định hướng của các phần tử con
        row: theo hàng ngang
        column: theo hàng dọc
        row-reverse: theo hàng ngang ngược lại
        column-reverse: theo hàng dọc ngược lại
     } -->
     <div class="box1">khối-1</div>
     <div class="box2">khối-2</div>
     <div class="box3">khối-3</div>
     <button class="button-1">Nút 1</button>
     <button class="button-2">Nút 2</button>
</body>
</html>
